# Publishes @sinaispace/agentlens to npm using trusted publishing (OIDC).
#
# No npm token is stored anywhere. GitHub mints a short-lived OIDC token for
# this workflow, npm verifies it against the trusted publisher configured on
# the package, and publishes. That is what npm is steering everyone toward:
# bypass-2FA tokens lose direct publish in January 2027.
#
# One-time setup on npmjs.com (package → Settings → Trusted publisher):
#   Publisher:  GitHub Actions
#   Repository: sinaispace/agentlens
#   Workflow:   publish.yml
#
# To release: bump the version in package.json, commit, then push a tag.
#   npm version patch && git push --follow-tags
name: Publish

on:
  push:
    tags:
      - "v*"
  # Lets a release be re-run from the Actions tab without moving the tag.
  workflow_dispatch:

permissions:
  contents: read
  # Required for OIDC. Without it npm falls back to token auth and fails.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1+; Node 22 still ships npm 10.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@latest

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Guards against tagging v0.2.0 while package.json still says 0.1.0,
      # which would otherwise publish the wrong version under a misleading tag.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish
